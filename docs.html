<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="EVA documentation — fees, vesting, governance, risk monitor, contracts.">
<title>EVA — التوثيق</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<style>
.docs-hero{padding:150px 0 30px;text-align:center}
.docs-hero h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:12px}
.docs-hero p{color:var(--muted);max-width:640px;margin:0 auto 18px}
.doc-section{margin:26px 0;padding:34px}
.doc-section h2{margin-bottom:16px;font-size:1.4rem}
.doc-section p{color:#c9d6e2;line-height:1.9;margin-bottom:14px}
.doc-note{border-inline-start:3px solid var(--warn,#f0a840);padding-inline-start:14px;color:var(--muted);font-size:.92rem}
.doc-table{width:100%;border-collapse:collapse;font-size:.95rem}
.doc-table th,.doc-table td{padding:12px 14px;text-align:start;border-bottom:1px solid rgba(255,255,255,.07)}
.doc-table th{color:var(--muted);font-weight:600;font-size:.85rem}
.doc-table td{font-variant-numeric:tabular-nums}
.back-link{display:inline-block;margin-top:6px;color:var(--cyan);text-decoration:none;border-bottom:1px dotted var(--cyan)}
.back-link:hover{color:#fff;border-bottom-color:#fff}
#docs-contracts .contract-row{margin-bottom:10px}
.doc-anchor{scroll-margin-top:110px}
</style>
</head>
<body>
<div id="cursor-ring"></div><div id="cursor-dot"></div>

<header id="nav">
  <a href="index.html" class="brand">
    <img src="logo.png" alt="EVA logo" class="brand-logo">
    <span class="brand-name">EVA</span>
  </a>
  <nav class="nav-links" id="nav-links">
    <a href="index.html#about" data-i18n="nav.about"></a>
    <a href="index.html#benefits" data-i18n="nav.benefits"></a>
    <a href="index.html#problems" data-i18n="nav.problems"></a>
    <a href="index.html#immune" data-i18n="nav.immune"></a>
    <a href="index.html#tokenomics" data-i18n="nav.tokenomics"></a>
    <a href="index.html#trade" data-i18n="nav.trade"></a>
    <a href="index.html#contracts" data-i18n="nav.contracts"></a>
    <a href="docs.html" data-i18n="nav.docs" aria-current="page"></a>
  </nav>
  <div class="nav-actions">
    <button id="lang-toggle" class="pill-btn" type="button"></button>
    <button id="menu-toggle" class="pill-btn" type="button" aria-label="menu">☰</button>
  </div>
</header>

<section class="docs-hero">
  <div class="container">
    <h1 data-i18n="docs.title"></h1>
    <p data-i18n="docs.sub"></p>
    <a class="back-link" href="index.html" data-i18n="docs.back"></a>
  </div>
</section>

<main id="docs-main" class="container"></main>

<footer>
  <div class="container footer-inner">
    <div class="footer-brand">
      <img src="logo.png" alt="EVA logo" class="footer-logo">
      <span>EVA</span>
    </div>
    <p><span data-i18n="footer.rights"></span> <a class="footer-code" target="_blank" rel="noopener" href="https://github.com/RIO4140/eva-contracts" data-i18n="footer.code"></a></p>
    <p class="risk" data-i18n="footer.risk"></p>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="docs.js"></script>
</body>
</html>
